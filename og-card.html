<!DOCTYPE html>
<!--
  og-image.png 소스 — 공유 카드(1200×630)입니다.

  만드는 법 (이 파일을 고치고 다시 렌더링):
    "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --disable-gpu \
      --hide-scrollbars --window-size=1200,630 \
      --screenshot="C:/project/04_monsterlab/og-image.png" \
      "file:///C:/project/04_monsterlab/og-card.html"

  이 파일은 배포되는 페이지가 아니라 이미지 원본입니다 (index.html에서 링크하지 않음).
  index.html의 <meta property="og:image">가 가리키는 og-image.png를 갱신할 때만 씁니다.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>MonsterLab — 공유 카드</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 34px;
    padding: 0 96px;
    background: #0a0e13;
    color: #e6edf3;
    font-family: 'Segoe UI', 'Malgun Gothic', system-ui, -apple-system, sans-serif;
  }

  /* 사이트 히어로와 같은 민트 글로우 */
  .glow {
    position: absolute;
    top: -180px;
    right: -120px;
    width: 640px;
    height: 640px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(110, 231, 168, 0.16) 0%, rgba(110, 231, 168, 0) 68%);
  }
  .glow-2 {
    position: absolute;
    bottom: -260px;
    left: -140px;
    width: 560px;
    height: 560px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(110, 231, 168, 0.08) 0%, rgba(110, 231, 168, 0) 70%);
  }

  .brand { display: flex; align-items: center; gap: 24px; }
  .mark {
    width: 108px;
    height: 108px;
    border-radius: 28px;
    background: linear-gradient(135deg, #6ee7a8 0%, #34d399 100%);
    color: #0a0e13;
    font-size: 64px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .name { font-size: 84px; font-weight: 800; letter-spacing: -1px; }
  .name .accent { color: #6ee7a8; }

  .tagline { font-size: 42px; font-weight: 600; color: #c9d4de; letter-spacing: -0.5px; }
  .tagline .accent { color: #6ee7a8; }

  .services { display: flex; gap: 18px; }
  .pill {
    padding: 18px 32px;
    border: 1px solid rgba(110, 231, 168, 0.35);
    border-radius: 999px;
    background: rgba(110, 231, 168, 0.08);
    font-size: 30px;
    font-weight: 600;
    color: #9fb2c0;
  }
  .pill b { color: #e6edf3; font-weight: 700; }

  .domain {
    position: absolute;
    right: 96px;
    bottom: 56px;
    font-size: 28px;
    color: #6ee7a8;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow-2"></div>

  <div class="brand">
    <div class="mark">M</div>
    <div class="name">Monster<span class="accent">Lab</span></div>
  </div>

  <div class="tagline">작은 아이디어를 <span class="accent">괴물 같은 서비스</span>로.</div>

  <div class="services">
    <div class="pill"><b>toeic</b>.monster</div>
    <div class="pill"><b>engmon</b>.monster</div>
    <div class="pill"><b>buddha</b>.monster</div>
  </div>

  <div class="domain">monsterlab.monster</div>
</body>
</html>
